<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fahm-e-Salaf — فہمِ سلف</title>
    <meta name="description" content="Quran, Sunnat aur mustanad hawalon ki bunyaad par Islami aqaid, masail aur tahqiqi mazameen." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&family=Aref+Ruqaa:wght@700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("fs_theme");
          // Saved choice wins; "auto" (Default) follows the device; first visit = light.
          if (s === "auto") s = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          else if (["light", "sepia", "dark"].indexOf(s) < 0) s = "light";
          var d = document.documentElement;
          d.classList.toggle("dark", s === "dark");
          if (s === "sepia") d.setAttribute("data-theme", "sepia"); else d.removeAttribute("data-theme");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
