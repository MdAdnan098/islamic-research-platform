name = "islamic-research-backend"
main = "src/index.js"

# Node.js compatibility (needed by the MongoDB Node.js driver for
# `cloudflare:sockets` support) is enabled by default for any
# compatibility_date of 2026-08-04 or later, so no explicit
# `nodejs_compat` compatibility flag is needed or accepted here.
# Keep this set to today's date when you touch this file.
compatibility_date = "2026-09-27"

# Keep variables that were added in the Cloudflare dashboard (e.g.
# IMAGEKIT_URL_ENDPOINT) instead of deleting them on every deploy.
keep_vars = true

# Non-secret configuration. Real secrets (MONGODB_URI, etc.) must be set with
# `wrangler secret put <NAME>` and must never be committed here.
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://islamic-research-platform.pages.dev"
# Media storage: ImageKit (temporary). Without this the Worker falls back to R2
# and uploads fail with "R2 bucket binding (MEDIA_BUCKET) is not configured".
MEDIA_PROVIDER = "imagekit"

# R2 bucket binding for scanned pages / images / PDFs.
# Create the bucket first with: wrangler r2 bucket create islamic-research-media